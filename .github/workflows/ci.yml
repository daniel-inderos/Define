name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Prefer an Xcode whose SDK has the Liquid Glass APIs; the code
      # compiles either way thanks to compiler-version guards.
      - name: Select Xcode
        run: |
          for xc in /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode_16.4.app; do
            if [ -d "$xc" ]; then sudo xcode-select -s "$xc"; break; fi
          done
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: make app

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Define.app
          path: build/Define.app
